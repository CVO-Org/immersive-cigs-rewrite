# This action will use hemtt release to build the mod folder which then will be uploaded to the provided steam workshop page
#
# Pre-Requisites
# - Mod needs to be already on the Workshop
# - Steam Account that owns Arma and needs to be a contributer to the workshop item.
# -- It is recommended to use a dedicated Steam Account with 2FA disabled.
#
# How to use
#
# 1. Update FOLDER, WORKSHOPID and WORKSHOPNAME below
# 2. Add STEAM_USERNAME as github repo secret
# 3. Add STEAM_PASSWORD as github repo secret
# 4. Remove the `if: false` line of the job
#
# The DEV release runs on pre-releases AND releases and sets _DEV_VERSION_ 1 (see addons/main/debug_mode.hpp)
# If you only maintain a single workshop item, delete this file and only use release-stable.yml

name: "Release: Publish to Steam [DEV]"

env:
  FOLDER: '@cigs-dev'
  WORKSHOPID: '3518473416'
  WORKSHOPNAME: 'Immersive Cigs - Rewrite [DEV]'

on:
  release:
    types: [prereleased,released]

permissions:
  contents: write

jobs:

  release-addon:
    runs-on: ubuntu-latest
    steps:
        - name: Set VERSION env
          run: echo VERSION=${GITHUB_REF:11} >> $GITHUB_ENV

        - name: Checkout the source code
          uses: actions/checkout@v4

        - name: Update script_version.hpp from release tag
          shell: pwsh
          run: |
            & "${{ github.workspace }}/tools/update-version.ps1" `
              -Version "${{ github.event.release.tag_name }}"

        - name: Create meta.cpp for dev release
          shell: pwsh
          run: |
            & "${{ github.workspace }}/tools/create-meta-cpp.ps1" `
              -FilePath "${{ github.workspace }}/meta.cpp" `
              -PublishedId "${{ env.WORKSHOPID }}" `
              -ModName "${{ env.WORKSHOPNAME }}"

        - name: Setup HEMTT
          uses: arma-actions/hemtt@v1

        - name: Run HEMTT script set_RELEASE_VERSION_DEV
          run: hemtt script set_RELEASE_VERSION_DEV

        - name: Run HEMTT build
          run: hemtt release --no-archive

        - name: Move release to releases folder
          run: mv .hemttout/release "${{ env.FOLDER }}-${{ env.VERSION }}"

        - name: Zip release
          run: zip -r "${{ env.FOLDER }}-${{ env.VERSION }}.zip" ./${{ env.FOLDER }}-${{ env.VERSION }}

        - name: Update Release with Files
          uses: softprops/action-gh-release@v2
          with:
            files: ./${{ env.FOLDER }}-${{ env.VERSION }}.zip
            draft: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Update to Steam Workshop (dev)
          uses: arma-actions/workshop-upload@v1
          with:
            itemId: ${{ env.WORKSHOPID }}
            contentPath: './${{ env.FOLDER }}-${{ env.VERSION }}'
            changelog: |
              https://github.com/${{ github.repository }}/releases/tag/v${{ env.VERSION }}

              ${{ github.event.release.body }}
          env:
            STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
            STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
