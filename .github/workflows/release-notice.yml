# Posts the GitHub release notes into a Discord channel via webhook
#
# Requires the DISCORD_WEBHOOK_URL github repo secret
#
# This is a reusable workflow - it does not trigger on its own.
# It is called by the release workflows after their Steam upload succeeded:
# - release-dev.yml calls it for pre-releases
# - release-stable.yml calls it for full releases
# The callers pass their release event through, so github.event.release is available here.

name: "Release: Discord Notice"

on:
  workflow_call:

jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Github Releases To Discord
        uses: SethCohen/github-releases-to-discord@v1.19.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "Immersive Cigs - Rewrite"
          content: "||<@&1433861420008865872>||"
          footer_title: "Immersive Cigs - Rewrite"
          footer_timestamp: true
