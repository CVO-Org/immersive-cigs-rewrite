# Keeps an open issue titled "Translations" updated with the localization coverage report of `hemtt ln coverage`
# The issue is created automatically if it does not exist yet

name: "Github: Translation Issue"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/stringtable.xml'

permissions:
  contents: read
  issues: write

jobs:
  update-translations:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1

      - name: Generate translation report
        run: |
          set -o pipefail
          {
            echo "**[Translation Guide](https://ace3.acemod.org/wiki/development/how-to-translate-ace3.html)**"
            echo
            # hemtt also logs to stdout - only keep the markdown table
            hemtt ln coverage --format markdown | grep '^|'
          } > report.md
          cat report.md

      - name: Create or update the "Translations" issue
        run: |
          issue=$(gh issue list --state open --limit 1000 --json number,title \
            --jq '[.[] | select(.title | ascii_downcase == "translations")][0].number // empty')

          if [ -z "$issue" ]; then
            gh issue create --title "Translations" --body-file report.md
          elif [ "$(gh issue view "$issue" --json body --jq .body)" = "$(cat report.md)" ]; then
            echo "Issue #$issue is already up to date"
          else
            gh issue edit "$issue" --body-file report.md
          fi
