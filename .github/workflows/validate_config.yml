name: "Validate: Config"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v4
    - name: Validate Config
      run: python tools/validate_config.py
    - name: Check every model has a model.cfg entry
      run: python tools/check_model_cfg.py