name: "Validate: HEMTT"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v4
    - name: Fill template placeholders
      # Only does something in the template repo itself - "~" is not valid in class names, so the raw template can't pass hemtt check
      # The placeholders are assembled from T on purpose, so the "find and replace" during mod setup doesn't alter this step
      run: |
        T='~'
        files=$(grep -rlI --exclude-dir=.git --exclude-dir=include -e "${T}MAINPREFIX${T}" -e "${T}PREFIX${T}" . || true)
        if [ -n "$files" ]; then
          echo "Template placeholders found, filling them in for this check"
          echo "$files" | xargs sed -i "s/${T}MAINPREFIX${T}/z/g; s/${T}PREFIX${T}/tmpl/g"
        fi
    - name: Setup HEMTT
      uses: arma-actions/hemtt@v1
    - name: Validate HEMTT
      run: hemtt check
