[base]
mission = "test.VR"
workshop = [
    "450814997",  # CBA_A3's Workshop ID
    "3499977893", # Advanced Developer Tools
    "463939057",  # ACE3 - in every profile, the test missions need it
]
dlc = [
]

optionals = [
]

parameters = [
    "-window",
    "-noPause",
    "-noPauseAudio",
]

[default]
extends = "base"
workshop = [
    "1779063631", # ZEN
]

# executable = "arma3_x64"        # Default: "arma3_x64"
# file_patching = true # Default: true
# binarize = false # Default: false
# rapify = true # Default: true


[asp]
extends = "default"
workshop = [
    "1645973522", # Intercept Minimal Dev
    "1652506957", # Arma Script Profiler
]

[aceax]
extends = "default"
workshop = [
    "2522638637", # ACE3 Arsenal Extended - Core
]

[light]
extends = "default"
mission = "test.altis"
workshop = [
    "1613905318", # Emitter 3Ditor
]

# All CDLCs but Contact (singleplayer only; its freemium content loads without it) - to read the faction classes for the faction presets
[factions]
extends = "base"
dlc = [
    "Global Mobilization",
    "S.O.G. Prairie Fire",
    "CSLA Iron Curtain",
    "Western Sahara",
    "Spearhead 1944",
    "Reaction Forces",
    "Expeditionary Forces",
]

# RHS (all four mods) - to read the faction classes for the faction presets. ACE comes from base.
[rhs]
extends = "base"
workshop = [
    "843425103", # RHSAFRF
    "843577117", # RHSUSAF
    "843593391", # RHSGREF
    "843632231", # RHSSAF
]

# Candidate terrains for new terrain presets - to read their worldNames. The autotest mission logs every loaded terrain
# to the RPT ("[cigs][terrains]", autotest.VR\tests\fn_terrains.sqf): .\tools\autotest.ps1 terrains -Grep '[cigs][terrains]'.
# Gabreta comes with CSLA Iron Curtain. ACE comes from base.
[terrains]
extends = "base"
dlc = [
    "CSLA Iron Curtain",  # Gabreta
]
workshop = [
    "583496184",  # CUP Terrains - Core (needed by New Esseker and Anizay)
    "428181330",  # Bornholm - Prince
    "1291778160", # Hellanmaa (+ Winter) - Klubi
    "2712204589", # New Esseker - Drina
    "1252091296", # Tembelan Island - Gudang Garam
    "1537973181", # Anizay - Takistan brands
    "761349672",  # CLAfghan - Takistan brands
    "908733096",  # Fallujah 1.2 - Cleopatra
]

# RHS + 3CB Factions + 3CB BAF - to read the 3CB faction classes for the faction presets. ACE comes from base.
[3cb]
extends = "rhs"
workshop = [
    "1673456286", # 3CB Factions
    "893328083",  # 3CB BAF Equipment
    "893339590",  # 3CB BAF Weapons
    "893346105",  # 3CB BAF Units
    "893349825",  # 3CB BAF Vehicles
    "1661066023", # RKSL Studios: Attachments - needed by 3CB BAF Weapons, else missing-addon popups block the game
]

# Antistasi Community - for the Antistasi template presets. Start an Antistasi scenario from the menu
# (the test mission doesn't run it); vanilla templates work without other mods. ACE comes from base.
[antistasi]
extends = "base"
workshop = [
    "2867537125", # Antistasi - The Mod
]

# Unattended test run: switches the mission to autotest.VR. Chain it last, after a modset: hemtt launch 3cb autotest
# The game starts the preview, runs the tests and quits by itself; tools\autotest.ps1 adds it and reports the result.
[autotest]
mission = "autotest.VR"

# Every modset at once, for one autotest run instead of one per profile: 3cb (with RHS), the factions CDLCs and
# Antistasi. Not the terrains (only a list, and CUP Terrains makes the load much longer). ACE comes from base.
# .\tools\autotest.ps1 all
[all]
extends = "3cb"
dlc = [
    "Global Mobilization",
    "S.O.G. Prairie Fire",
    "CSLA Iron Curtain",
    "Western Sahara",
    "Spearhead 1944",
    "Reaction Forces",
    "Expeditionary Forces",
]
workshop = [
    "2867537125", # Antistasi - The Mod
]
