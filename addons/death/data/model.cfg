// Gives each model here its own CfgModels entry and a skeleton.
// Without them the engine falls back to the global CfgModels >> Default,
// which other mods sometimes break (see issue #343).
class CfgSkeletons {
    class Default {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] = {};
    };
    // Only models without a skeleton showed the error in #343 (the cigarettes have one),
    // so these get a one-bone skeleton too.
    class cigs_static {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] = {"cigs_root", ""};
    };
};

class CfgModels {
    class Default {
        sectionsInherit = "";
        sections[] = {};
        skeletonName = "cigs_static";
    };
    class cigpack: Default {};
};
