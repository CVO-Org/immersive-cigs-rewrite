  <path d="M44 -7 H-32" fill="none" stroke="#1f1813" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 6 H10 a8 8 0 1 0 8 8" fill="none" stroke="#1f1813" stroke-width="4" stroke-linecap="round"/>
  <circle r="46" fill="none" stroke="#1f1813" stroke-width="3"/>
</g>
<pattern id="zigzag" width="16" height="10" patternUnits="userSpaceOnUse">
  <rect width="16" height="10" fill="#1f1813"/>
