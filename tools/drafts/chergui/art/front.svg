<text x="180.5" y="506" text-anchor="middle" font-family="Bahnschrift, 'Arial Narrow', Arial, sans-serif" font-size="20" font-weight="bold" letter-spacing="2" fill="#f2e6c9">TABAC BRUN · SANS FILTRE</text>
