  <path d="M44 -6 H-30" fill="none" stroke="#1f1813" stroke-width="4" stroke-linecap="round"/>
  <path d="M38 6 H6 q-10 0 -10 8 q0 7 7 7 q6 0 6 -5" fill="none" stroke="#1f1813" stroke-width="4" stroke-linecap="round"/>
  <circle r="46" fill="none" stroke="#1f1813" stroke-width="3"/>
</g>
<pattern id="zigzag" width="16" height="10" patternUnits="userSpaceOnUse">
