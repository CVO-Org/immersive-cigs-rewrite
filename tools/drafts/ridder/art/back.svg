<text x="180.5" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#c0262d">En ægte dansk cigaret.</text>
<rect x="22" y="262" width="317" height="148" fill="#ffffff" stroke="#1b1f2a" stroke-width="2"/>
<g font-family="'Segoe UI', Arial, sans-serif" fill="#1b1f2a" text-anchor="middle">
  <text x="180.5" y="290" font-size="15" font-weight="bold">Sundhedsstyrelsen advarer:</text>
  <text x="180.5" y="316" font-size="19" font-weight="bold">Rygning skader helbredet.</text>
  <text x="180.5" y="346" font-size="13">Røgen fra en cigaret af dette mærke</text>
  <text x="180.5" y="364" font-size="13">indeholder ca. 1,1 mg nikotin</text>
  <text x="180.5" y="382" font-size="13">og 15 mg tjære.</text>
